{% extends "base.html" %}
{% block title %}Log in - Instaretto{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post" class="form">
    <label>Email
      <input type="email" name="email" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">No account? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
  <p class="muted">Seed users: alice@example.com / bob@example.com, password "password123".</p>
{% endblock %}
