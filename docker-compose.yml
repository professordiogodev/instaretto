services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: instaretto
      POSTGRES_PASSWORD: instaretto
      POSTGRES_DB: instaretto
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instaretto"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Bind mount (not a named volume) so scripts/ship_logs.sh can read
      # these files directly from your host shell in Part 5, using the
      # same AWS CLI profile you already configured in Part 1.
      - ./data/logs:/var/log/instaretto
      # Read-only mount of the student's AWS CLI credentials/config so
      # boto3's default credential chain can find them locally. On EC2
      # (Part 6) this mount is removed entirely -- the instance profile
      # takes over and no credentials file exists at all.
      - ~/.aws:/home/appuser/.aws:ro
    environment:
      HOME: /home/appuser
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
